<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 24px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 12px; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #94a3b8; font-size: 14px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; }
        .radio-group { display: flex; gap: 10px; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; justify-content: center; gap: 5px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; flex: 1; text-align: center; margin: 0; font-weight: normal; }
        .radio-group label:has(input:checked) { border-color: #38bdf8; background: #1e3a8a33; }
        button { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #siteInfo { margin-top: 10px; padding: 10px; background: #0f172a; border-radius: 8px; text-align: center; font-size: 13px; color: #94a3b8; display: none; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 14px; display: none; }
        .loading { background: #1e3a8a; color: #93c5fd; }
        .success { background: #064e3b; color: #6ee7b7; }
        .error { background: #7f1d1d; color: #fca5a5; }
        .hidden { display: none !important; }
        .progress-bar { width: 100%; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #a78bfa); width: 0%; transition: width 0.5s; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; color: #94a3b8; }
        .browser-dl-btn { background: #22c55e; color: white; margin-top: 10px; display: none; text-align: center; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Universal Downloader</h1>
        <p class="subtitle">YouTube • Facebook • Instagram • TikTok + 1000 more</p>
        
        <label>🔗 Video URL:</label>
        <input type="text" id="urlInput" placeholder="https://... paste koro" oninput="detectSite()">
        <div id="siteInfo"></div>
        
        <label>📁 Type:</label>
        <div class="radio-group">
            <label><input type="radio" name="type" value="mp4" checked onchange="toggleQuality()"><span>🎬 Video</span></label>
            <label><input type="radio" name="type" value="mp3" onchange="toggleQuality()"><span>🎵 Audio</span></label>
        </div>
        
        <div id="qualityDiv">
            <label>🎚️ Quality:</label>
            <select id="qualitySelect">
                <option value="360">360p</option>
                <option value="480">480p</option>
                <option value="720" selected>720p (HD)</option>
                <option value="1080">1080p (FHD)</option>
            </select>
        </div>
        
        <button id="downloadBtn" onclick="startDownload()">⬇️ Download Shuru Koro</button>
        
        <div id="status">
            <div id="statusMsg"></div>
            <div class="progress-bar" id="progressBar" style="display:none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info" id="progressInfo" style="display:none;">
                <span id="progressPct">0%</span>
                <span id="progressSpeed"></span>
                <span id="progressEta"></span>
            </div>
            <!-- Ekhane browser download button ta ashbe -->
            <a id="browserDlBtn" class="browser-dl-btn" href="#">📥 Save to Browser / Device</a>
        </div>
    </div>

    <script>
        let detectTimeout = null;

        async function detectSite() {
            clearTimeout(detectTimeout);
            const url = document.getElementById('urlInput').value.trim();
            const infoDiv = document.getElementById('siteInfo');
            if (!url.startsWith('http')) { infoDiv.style.display = 'none'; return; }
            
            detectTimeout = setTimeout(async () => {
                try {
                    const res = await fetch('/api/detect', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: url}) });
                    const data = await res.json();
                    if (data.site) {
                        infoDiv.style.display = 'block';
                        infoDiv.innerHTML = `🔍 Detected: <b>${data.site}</b> | Engine: <b>${data.method}</b>`;
                    }
                } catch(e) {}
            }, 500);
        }

        function toggleQuality() {
            const type = document.querySelector('input[name="type"]:checked').value;
            document.getElementById('qualityDiv').classList.toggle('hidden', type === 'mp3');
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const type = document.querySelector('input[name="type"]:checked').value;
            const quality = document.getElementById('qualitySelect').value;
            const btn = document.getElementById('downloadBtn');
            const browserDlBtn = document.getElementById('browserDlBtn');

            if (!url) { showStatus('error', '❌ Link ta khali!'); return; }

            btn.disabled = true;
            btn.innerText = '⏳ Download hocche...';
            browserDlBtn.style.display = 'none'; // Purono button lukiye dao
            
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressInfo').style.display = 'flex';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPct').innerText = '0%';
            showStatus('loading', '⏳ Server e request pathano hocche...');

            try {
                const res = await fetch('/api/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: url, type: type, quality: quality}) });
                const data = await res.json();
                if (data.error) { showStatus('error', data.error); btn.disabled = false; btn.innerText = '⬇️ Download Shuru Koro'; return; }
                checkStatus();
            } catch (e) {
                showStatus('error', '❌ Server error!');
                btn.disabled = false; btn.innerText = '⬇️ Download Shuru Koro';
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const btn = document.getElementById('downloadBtn');
                const browserDlBtn = document.getElementById('browserDlBtn');

                if (data.is_downloading) {
                    showStatus('loading', data.message || '⏳ Download cholche...');
                    if (data.progress > 0) {
                        document.getElementById('progressFill').style.width = data.progress + '%';
                        document.getElementById('progressPct').innerText = data.progress + '%';
                        document.getElementById('progressSpeed').innerText = data.speed ? '⚡ ' + data.speed : '';
                        document.getElementById('progressEta').innerText = data.eta ? '⏱️ ' + data.eta : '';
                    }
                    setTimeout(checkStatus, 1500);
                } else {
                    if (data.success) {
                        showStatus('success', '✅ Server download shesh! Ekhon nicher button ta chapo.');
                        document.getElementById('progressFill').style.width = '100%';
                        document.getElementById('progressPct').innerText = '100%';
                        
                        // Browser download button ta dekhao
                        if (data.filename) {
                            browserDlBtn.style.display = 'block';
                            browserDlBtn.href = '/api/get_file/' + encodeURIComponent(data.filename);
                            browserDlBtn.innerText = '📥 Save to Browser / Device';
                            
                            // Auto download trigger (Optional)
                            // browserDlBtn.click(); 
                        }
                    } else {
                        showStatus('error', data.message || '❌ Download fail!');
                    }
                    btn.disabled = false;
                    btn.innerText = '⬇️ Download Shuru Koro';
                }
            } catch(e) { setTimeout(checkStatus, 3000); }
        }

        function showStatus(type, msg) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = type;
            document.getElementById('statusMsg').innerText = msg;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
